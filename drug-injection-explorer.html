<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Injection to Receptor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">

<style>
:root{
  --ground:#0B1016;
  --panel:rgba(19,27,36,.82);
  --panel-solid:#131B24;
  --hairline:#223040;
  --hairline-soft:#1A2531;
  --ink:#E6EDF3;
  --ink-dim:#8FA3B5;
  --ink-faint:#5E7285;
  --blood:#E24B58;
  --cell:#5A9BE0;
  --receptor:#43C68A;
  --drug:#FF7E52;
  --accent:#FF7E52;
  --accent-ink:#12181F;
  --track:#22303F;
  --seg:#2C3B4C;
  --contrast:#FFE08A;
  --vein:#3F7CBE;
}
:root:not([data-theme="dark"]){
  --ground:#EDF1F4;
  --panel:rgba(255,255,255,.84);
  --panel-solid:#FFFFFF;
  --hairline:#C9D4DD;
  --hairline-soft:#DDE5EB;
  --ink:#0F1922;
  --ink-dim:#4C6274;
  --ink-faint:#74889A;
  --blood:#C2303E;
  --cell:#2E6FB8;
  --receptor:#1E9463;
  --drug:#DC4E1E;
  --accent:#DC4E1E;
  --accent-ink:#FFFFFF;
  --track:#D3DDE5;
  --seg:#C3CFD9;
  --contrast:#B5791A;
  --vein:#1F5A94;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0B1016;
    --panel:rgba(19,27,36,.82);
    --panel-solid:#131B24;
    --hairline:#223040;
    --hairline-soft:#1A2531;
    --ink:#E6EDF3;
    --ink-dim:#8FA3B5;
    --ink-faint:#5E7285;
    --blood:#E24B58;
    --cell:#5A9BE0;
    --receptor:#43C68A;
    --drug:#FF7E52;
    --accent:#FF7E52;
    --accent-ink:#12181F;
    --track:#22303F;
  --seg:#2C3B4C;
  --contrast:#FFE08A;
  --vein:#3F7CBE;
  }
}
:root[data-theme="dark"]{
  --ground:#0B1016;
  --panel:rgba(19,27,36,.82);
  --panel-solid:#131B24;
  --hairline:#223040;
  --hairline-soft:#1A2531;
  --ink:#E6EDF3;
  --ink-dim:#8FA3B5;
  --ink-faint:#5E7285;
  --blood:#E24B58;
  --cell:#5A9BE0;
  --receptor:#43C68A;
  --drug:#FF7E52;
  --accent:#FF7E52;
  --accent-ink:#12181F;
  --track:#22303F;
  --seg:#2C3B4C;
  --contrast:#FFE08A;
  --vein:#3F7CBE;
}

*{box-sizing:border-box}
/* #sites sets display:flex, which outranks the UA [hidden] rule */
[hidden]{display:none !important}
html,body{height:100%}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

#stage{position:fixed;inset:0}
#scene{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
#scene.dragging{cursor:grabbing}

#hud{position:fixed;inset:0;pointer-events:none;display:block}
#hud > *{pointer-events:auto}
#topstack{display:contents}

/* input-appropriate control hints */
.touch-only{display:none}
@media (hover:none){
  .pointer-only{display:none}
  .touch-only{display:inline}
}

/* ---------- readout panel ---------- */
#panel{
  position:fixed;top:20px;left:20px;width:322px;max-width:calc(100vw - 40px);
  background:var(--panel);border:1px solid var(--hairline);
  backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
}
.panel-head{display:flex;align-items:baseline;gap:8px;padding:14px 16px 0}
.dot{width:8px;height:8px;flex:none;align-self:center;background:var(--accent)}
.eyebrow{
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;font-weight:500;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);
}
#panel h1{
  font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-weight:700;
  font-size:27px;line-height:1.05;letter-spacing:-.022em;margin:6px 16px 0;
  text-wrap:balance;
}
#panel p{
  margin:9px 16px 14px;font-size:13.5px;line-height:1.5;color:var(--ink-dim);max-width:34ch;
}
.readout{
  display:grid;grid-template-columns:1fr 1fr;
  border-top:1px solid var(--hairline-soft);
}
.cell{padding:9px 16px 10px;border-top:1px solid var(--hairline-soft)}
.cell:nth-child(-n+2){border-top:0}
.cell:nth-child(odd){border-right:1px solid var(--hairline-soft)}
.cell dt{
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:9.5px;font-weight:500;
  letter-spacing:.13em;text-transform:uppercase;color:var(--ink-faint);margin:0 0 3px;
}
.cell dd{
  margin:0;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:15px;
  font-variant-numeric:tabular-nums;color:var(--ink);
}

/* ---------- phase timeline ---------- */
#timeline{border-top:1px solid var(--hairline-soft);padding:11px 16px 13px}
.tl-track{
  position:relative;height:10px;background:var(--track);
  display:flex;align-items:stretch;overflow:hidden;
}
.tl-seg{
  position:absolute;top:0;bottom:0;background:var(--seg);
  border-left:1px solid var(--panel-solid);
}
.tl-seg{min-width:3px}
.tl-seg.on{background:var(--accent)}
.tl-head{
  position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);
  left:0;z-index:2;
}
.tl-scale{
  display:flex;justify-content:space-between;margin-top:5px;
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:9.5px;
  letter-spacing:.1em;color:var(--ink-faint);font-variant-numeric:tabular-nums;
}
#tlPhase{margin:9px 0 0 !important;font-size:12.5px;line-height:1.45;color:var(--ink-dim);max-width:none !important}

/* ---------- site picker ---------- */
#sites{
  position:fixed;left:50%;transform:translateX(-50%);bottom:94px;
  max-width:calc(100vw - 32px);
  background:var(--panel);border:1px solid var(--hairline);
  backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
  padding:9px 12px 10px;display:flex;flex-direction:column;gap:7px;
}
.chips{display:flex;gap:1px;background:var(--hairline);overflow-x:auto;overscroll-behavior-x:contain}
.chip{
  appearance:none;border:0;background:var(--panel-solid);color:var(--ink-dim);
  font-family:inherit;font-size:12px;cursor:pointer;white-space:nowrap;
  padding:7px 12px 8px;display:flex;flex-direction:column;gap:2px;text-align:left;
  border-bottom:2px solid transparent;
}
.chip b{font-weight:500;color:inherit}
.chip i{
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-style:normal;font-size:9px;
  letter-spacing:.11em;text-transform:uppercase;color:var(--ink-faint);
}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.chip[aria-pressed="true"] i{color:var(--accent)}

/* ---------- legend ---------- */
#legend{
  position:fixed;top:20px;right:20px;
  background:var(--panel);border:1px solid var(--hairline);padding:11px 14px 12px;
  backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
  display:flex;flex-direction:column;gap:7px;
}
#legend .eyebrow{margin-bottom:2px}
#keys{display:flex;flex-direction:column;gap:7px}
.key{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-dim);white-space:nowrap}
.key i{width:9px;height:9px;flex:none;display:block}
.key b{font-weight:500;color:var(--ink)}

/* ---------- dock ---------- */
#dock{
  position:fixed;left:50%;bottom:20px;transform:translateX(-50%);
  display:flex;align-items:stretch;flex-wrap:nowrap;justify-content:center;gap:1px;
  background:var(--hairline);border:1px solid var(--hairline);
  max-width:calc(100vw - 32px);
}
.group{display:flex;align-items:stretch;gap:1px;background:var(--hairline)}
.slot{background:var(--panel-solid);display:flex;align-items:center}

/* scale ladder */
.rung{
  appearance:none;border:0;background:var(--panel-solid);color:var(--ink-dim);
  font-family:inherit;cursor:pointer;text-align:left;
  padding:9px 14px 8px;display:flex;flex-direction:column;gap:2px;min-width:104px;
  border-bottom:2px solid transparent;
}
.rung .n{
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:9.5px;letter-spacing:.13em;
  color:var(--ink-faint);
}
.rung .l{
  font-family:Archivo,sans-serif;font-weight:600;font-size:12.5px;letter-spacing:.03em;
  text-transform:uppercase;
}
.rung .m{
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;color:var(--ink-faint);
  font-variant-numeric:tabular-nums;
}
.rung:hover{color:var(--ink)}
.rung[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.rung[aria-pressed="true"] .n{color:var(--accent)}

/* buttons */
.btn{
  appearance:none;border:0;background:var(--panel-solid);color:var(--ink-dim);
  font-family:Archivo,sans-serif;font-weight:600;font-size:11.5px;letter-spacing:.09em;
  text-transform:uppercase;cursor:pointer;padding:0 16px;min-width:78px;
  display:flex;align-items:center;justify-content:center;gap:7px;
}
.btn:hover{color:var(--ink)}
.btn svg{display:block;flex:none}
#play[data-on="true"]{color:var(--accent)}

/* speed */
.speed{padding:0 15px;gap:11px}
.speed label{
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:9.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-faint);
}
#speed{appearance:none;width:104px;height:16px;background:transparent;cursor:pointer;margin:0}
#speed::-webkit-slider-runnable-track{height:2px;background:var(--track)}
#speed::-moz-range-track{height:2px;background:var(--track)}
#speed::-webkit-slider-thumb{
  appearance:none;width:11px;height:11px;background:var(--accent);border:0;border-radius:0;
  margin-top:-4.5px;
}
#speed::-moz-range-thumb{width:11px;height:11px;background:var(--accent);border:0;border-radius:0}
#speedVal{
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;color:var(--ink);
  font-variant-numeric:tabular-nums;min-width:34px;
}

:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

/* ---------- tooltip ---------- */
#tip{
  position:fixed;pointer-events:none;opacity:0;transition:opacity .12s linear;
  background:var(--panel-solid);border:1px solid var(--hairline);
  padding:6px 9px;transform:translate(12px,-50%);z-index:5;
}
#tip strong{
  display:block;font-family:Archivo,sans-serif;font-weight:600;font-size:12px;
  letter-spacing:.02em;color:var(--ink);
}
#tip span{
  display:block;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;
  color:var(--ink-faint);letter-spacing:.06em;margin-top:2px;
}

#hint{
  position:fixed;left:20px;bottom:20px;font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);
  line-height:1.7;
}

@media (max-width:980px){
  #panel{width:292px}
  #panel h1{font-size:23px}
  #legend{top:16px;right:16px}
  #hint{left:16px;bottom:16px}
}
@media (max-width:900px){
  #dock{flex-wrap:wrap}
  .speed{flex:1 1 100%;justify-content:center;padding:8px 15px}
  #sites{bottom:132px}
}

/* Narrow screens: everything the wide layout floats in three corners becomes
   one scrollable column, so no readout is dropped on a phone. */
@media (max-width:660px), (max-height:520px) and (max-width:940px){
  #topstack{
    display:flex;flex-direction:column;gap:8px;
    position:fixed;top:10px;left:10px;right:10px;
    max-height:calc(100vh - 178px);
    max-height:calc(100dvh - 178px);
    overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
    pointer-events:none;
  }
  #topstack > *{pointer-events:auto}

  #panel,#legend,#hint,#sites{position:static;width:auto;max-width:none;inset:auto;transform:none}
  #sites{order:1;padding:9px 12px 10px}
  #legend{order:2}
  #hint{order:3}
  .chip{padding:7px 9px 8px}
  #dock .group:first-child{display:grid;grid-template-columns:1fr 1fr}
  #panel h1{font-size:21px;margin-top:5px}
  #panel p{margin:8px 14px 12px;font-size:12.5px;max-width:none}
  .panel-head{padding:12px 14px 0}
  #panel h1{margin-left:14px;margin-right:14px}
  .cell{padding:8px 14px 9px}
  .cell dd{font-size:14px}

  #legend{padding:10px 14px 11px}
  #keys{flex-direction:row;flex-wrap:wrap;gap:5px 16px}

  #hint{padding:0 2px;line-height:1.6;font-size:9.5px}

  #dock{left:10px;right:10px;bottom:10px;transform:none;max-width:none}
  body[data-view="0"] #topstack{
    max-height:calc(100vh - 214px);
    max-height:calc(100dvh - 214px);
  }
  .group{flex:1 1 100%;flex-wrap:wrap}
  .rung{flex:1 1 0;min-width:0;padding:8px 8px 7px}
  .btn{flex:1 1 0;min-width:0;padding:10px 12px}
  .speed{flex:1 1 100%;justify-content:center;padding:9px 15px}
  #speed{flex:1 1 auto;width:auto;max-width:220px}
}

/* Landscape phones: wide but very short. Keep the stacked column (so the hint
   never lands under the dock) but narrow it, and put the dock back on one row. */
@media (max-height:520px) and (max-width:940px){
  #topstack{
    max-height:calc(100vh - 88px);
    max-height:calc(100dvh - 88px);
    width:min(404px, calc(100vw - 20px));right:auto;
  }
  #panel p{display:none}
  #dock{left:50%;right:auto;transform:translateX(-50%);bottom:10px;max-width:calc(100vw - 20px)}
  .group{flex:0 1 auto;flex-wrap:nowrap}
  .rung{flex:0 1 auto;min-width:92px}
  .btn{flex:0 1 auto;padding:0 14px}
  .speed{flex:0 1 auto;padding:0 14px;justify-content:flex-start}
  #speed{width:92px;flex:0 0 auto}
  #sites{order:1}
}

/* Readouts go 4-up on short screens only when the column can fit four labels. */
@media (max-height:520px) and (min-width:560px) and (max-width:940px){
  .readout{grid-template-columns:repeat(4,1fr)}
  .cell{border-top:0;padding:8px 10px 9px}
  .cell:not(:last-child){border-right:1px solid var(--hairline-soft)}
  .cell dd{font-size:13px}
}
@media (prefers-reduced-motion:reduce){
  #tip{transition:none}
}
</style>

<div id="stage"><canvas id="scene"></canvas></div>

<div id="hud">
  <div id="topstack">
    <section id="panel" aria-live="polite">
      <div class="panel-head"><span class="dot" id="pdot"></span><span class="eyebrow" id="peyebrow">Scale 01 — Systemic</span></div>
      <h1 id="ptitle">Through the bloodstream</h1>
      <p id="pbody"></p>
      <dl class="readout">
        <div class="cell"><dt>Elapsed</dt><dd id="rTime">00:00.0</dd></div>
        <div class="cell"><dt>Rate</dt><dd id="rRate">1.00&times;</dd></div>
        <div class="cell"><dt id="rFieldLabel">Field</dt><dd id="rField">~1 m</dd></div>
        <div class="cell"><dt id="rEventLabel">Deliveries</dt><dd id="rEvents">0</dd></div>
      </dl>
      <div id="timeline" hidden>
        <div class="tl-track" id="tlTrack"><div class="tl-head" id="tlHead"></div></div>
        <div class="tl-scale"><span>T+0</span><span id="tlEnd"></span></div>
        <p id="tlPhase"></p>
      </div>
    </section>

    <aside id="legend">
      <span class="eyebrow">Key</span>
      <div id="keys"></div>
    </aside>

    <p id="hint">
      <span class="pointer-only">Drag to orbit &middot; Scroll to zoom<br>Hover to label &middot; Click a site<br>Keys 1&ndash;4 scale &middot; Space play &middot; R reset</span>
      <span class="touch-only">Drag to orbit &middot; Pinch to zoom<br>Tap to label or to pick a site</span>
    </p>

    <div id="sites" hidden>
      <span class="eyebrow">Administration site</span>
      <div class="chips" id="chips" role="group" aria-label="Administration site"></div>
    </div>
  </div>

  <div id="dock">
    <div class="group" role="group" aria-label="Scale">
      <button class="rung" id="v0" aria-pressed="true"><span class="n">01</span><span class="l">Body</span><span class="m">~1.7 m</span></button>
      <button class="rung" id="v1" aria-pressed="false"><span class="n">02</span><span class="l">Systemic</span><span class="m">~5 mm</span></button>
      <button class="rung" id="v2" aria-pressed="false"><span class="n">03</span><span class="l">Cellular</span><span class="m">~10 µm</span></button>
      <button class="rung" id="v3" aria-pressed="false"><span class="n">04</span><span class="l">Molecular</span><span class="m">~1 nm</span></button>
    </div>
    <div class="group">
      <button class="btn" id="play" data-on="true" aria-label="Pause animation"><svg id="playIcon" width="9" height="11" viewBox="0 0 9 11" aria-hidden="true"><rect x="0" y="0" width="3" height="11" fill="currentColor"/><rect x="6" y="0" width="3" height="11" fill="currentColor"/></svg><span id="playLabel">Pause</span></button>
      <button class="btn" id="reset" aria-label="Reset current view">Reset</button>
      <div class="slot speed">
        <label for="speed">Speed</label>
        <input type="range" id="speed" min="0.1" max="2" step="0.05" value="1">
        <span id="speedVal">1.00&times;</span>
      </div>
    </div>
  </div>
</div>

<div id="tip" role="status"><strong id="tipName"></strong><span id="tipSub"></span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  }, {

    field: '~10 µm', eventLabel: 'Bindings', dist: 21, phi: 1.28, theta: 0.55, accent: C.receptor,

  }];

  /* ---------------- renderer ---------------- */
  var canvas = document.getElementById('scene');
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

  function isDark() {

  }

  /* ---------------- shared builders ---------------- */
  function lights(scene) {
    var dark = isDark();
    var hemi = new THREE.HemisphereLight(0xC8DCF0, dark ? 0x0A1017 : 0x9BAAB8, dark ? 0.72 : 1.05);
    scene.add(hemi);
    var key = new THREE.DirectionalLight(0xFFFFFF, dark ? 0.95 : 1.25);
    key.position.set(6, 9, 8); scene.add(key);
    var fill = new THREE.DirectionalLight(0x9FC4E8, dark ? 0.42 : 0.34);
    fill.position.set(-8, -3, -6); scene.add(fill);
    return { hemi: hemi, key: key, fill: fill };
  }

  function outline(geo, color, opacity) {
    return new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
      color: color, wireframe: true, transparent: true, opacity: opacity, depthWrite: false
    }));
  }

  function drugMesh(radius) {
    var g = new THREE.Group();
    var core = new THREE.Mesh(
      new THREE.IcosahedronGeometry(radius, 1),
      new THREE.MeshStandardMaterial({
        color: C.drug, emissive: C.drug, emissiveIntensity: 0.55,
        roughness: 0.35, metalness: 0.1
      })
    );
    var halo = new THREE.Mesh(
      new THREE.SphereGeometry(radius * 2.1, 14, 12),
      new THREE.MeshBasicMaterial({
        color: C.drug, transparent: true, opacity: 0.13,
        blending: THREE.AdditiveBlending, depthWrite: false
      })
    );
    g.add(core); g.add(halo);
    g.userData.core = core; g.userData.halo = halo;
    g.userData.label = 'Drug molecule';
    g.userData.sub = 'unbound · in transit';
    return g;
  }

  /* --------- particle bursts (binding events) --------- */
  function Bursts(scene, color, count, per) {
    var pool = [], i, j;
    for (i = 0; i < count; i++) {
      var pos = new Float32Array(per * 3);
      var geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      var pts = new THREE.Points(geo, new THREE.PointsMaterial({
        color: color, size: 0.26, transparent: true, opacity: 0,
        depthWrite: false, blending: THREE.AdditiveBlending
      }));
      pts.frustumCulled = false;
      scene.add(pts);
      pool.push({ pts: pts, pos: pos, vel: new Float32Array(per * 3), life: 0 });
    }
    var cursor = 0;
    return {
      fire: function (p) {
        var b = pool[cursor]; cursor = (cursor + 1) % pool.length;
        b.life = 1;
        for (j = 0; j < per; j++) {
          var th = Math.random() * TAU, ph = Math.acos(2 * Math.random() - 1);
          var s = 1.6 + Math.random() * 2.4;
          b.pos[j * 3] = p.x; b.pos[j * 3 + 1] = p.y; b.pos[j * 3 + 2] = p.z;
          b.vel[j * 3] = Math.sin(ph) * Math.cos(th) * s;
          b.vel[j * 3 + 1] = Math.cos(ph) * s;
          b.vel[j * 3 + 2] = Math.sin(ph) * Math.sin(th) * s;
        }
        b.pts.geometry.attributes.position.needsUpdate = true;
        b.pts.material.opacity = 0.95;
      },
      update: function (dt) {
        for (var k = 0; k < pool.length; k++) {
          var b = pool[k];
          if (b.life <= 0) continue;
          b.life = Math.max(0, b.life - dt * 1.5);
          for (j = 0; j < per; j++) {
            b.pos[j * 3] += b.vel[j * 3] * dt;
            b.pos[j * 3 + 1] += b.vel[j * 3 + 1] * dt;
            b.pos[j * 3 + 2] += b.vel[j * 3 + 2] * dt;
            b.vel[j * 3] *= 0.94; b.vel[j * 3 + 1] *= 0.94; b.vel[j * 3 + 2] *= 0.94;
          }
          b.pts.geometry.attributes.position.needsUpdate = true;
          b.pts.material.opacity = b.life * 0.95;
        }
      }
    };
  }

  /* ---------------- view 01 · systemic ---------------- */
  function buildSystemic() {
    var scene = new THREE.Scene();
    lights(scene);
    var hover = [];
    var LEN = 34, R = 1.25;

    var tubeGeo = new THREE.CylinderGeometry(R, R, LEN, 40, 1, true);
    var tube = new THREE.Mesh(tubeGeo, new THREE.MeshStandardMaterial({
      color: C.blood, transparent: true, opacity: 0.2, roughness: 0.5,
      side: THREE.DoubleSide, depthWrite: false
    }));
    tube.rotation.z = Math.PI / 2;
    tube.userData.label = 'Bloodstream';
    tube.userData.sub = 'vessel lumen · ~5 mm';
    tube.userData.lowPriority = true;
    scene.add(tube); hover.push(tube);

    var wall = outline(new THREE.CylinderGeometry(R * 1.005, R * 1.005, LEN, 22, 1, true), C.blood, 0.16);
    wall.rotation.z = Math.PI / 2; scene.add(wall);

    var rings = new THREE.Group();
    for (var r = 0; r < 9; r++) {
      var ring = new THREE.Mesh(
        new THREE.TorusGeometry(R * 1.03, 0.028, 6, 30),
        new THREE.MeshBasicMaterial({ color: C.blood, transparent: true, opacity: 0.4 })
      );
      ring.position.x = -LEN / 2 + 2 + r * ((LEN - 4) / 8);
      ring.rotation.y = Math.PI / 2;
      rings.add(ring);
    }
    scene.add(rings);

    var defs = [
      { name: 'Muscle cell', sub: 'rapid uptake · high perfusion', pos: new THREE.Vector3(-8.5, -5.4, 2.2) },
      { name: 'Fat cell', sub: 'slow uptake · lipid store', pos: new THREE.Vector3(0.5, 5.8, -2.6) },
      { name: 'Liver cell', sub: 'metabolism · first-pass clearance', pos: new THREE.Vector3(9.5, -5.0, -1.4) }
    ];
    var targets = [];
    defs.forEach(function (d) {
      var g = new THREE.Group(); g.position.copy(d.pos);
      var geo = new THREE.IcosahedronGeometry(1.85, 1);
      var body = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
        color: C.cell, transparent: true, opacity: 0.42, roughness: 0.45, metalness: 0.05
      }));
      var wire = outline(new THREE.IcosahedronGeometry(1.88, 1), C.cell, 0.55);
      g.add(body); g.add(wire);
      g.userData.label = d.name; g.userData.sub = d.sub;
      g.userData.body = body; g.userData.pulse = 0;
      scene.add(g); hover.push(g); targets.push(g);

      var anchor = new THREE.Vector3(d.pos.x, Math.sign(d.pos.y) * R, 0);
      var lg = new THREE.BufferGeometry().setFromPoints([anchor, d.pos.clone()]);
      scene.add(new THREE.Line(lg, new THREE.LineBasicMaterial({
        color: C.blood, transparent: true, opacity: 0.34
      })));
    });

    var bursts = Bursts(scene, C.drug, 6, 24);
    var mols = [];
    for (var i = 0; i < 30; i++) {
      var m = drugMesh(0.24);
      m.userData.p = Math.random() * LEN;
      m.userData.ph = Math.random() * TAU;
      m.userData.v = 3.2 + Math.random() * 2.2;
      m.userData.oy = (Math.random() - 0.5) * 0.9;
      m.userData.oz = (Math.random() - 0.5) * 0.9;
      m.userData.target = Math.random() < 0.42 ? (i % 3) : -1;
      m.userData.mode = 'flow';
      m.userData.k = 0;
      m.userData.from = new THREE.Vector3();
      scene.add(m); mols.push(m); hover.push(m);
    }

    function place(m) {
      var u = m.userData;
      m.position.set(
        -LEN / 2 + u.p,
        Math.sin(state.t * 1.9 + u.ph) * 0.4 + u.oy,
        Math.cos(state.t * 1.5 + u.ph) * 0.34 + u.oz
      );
    }

    return {
      scene: scene, hover: hover,
      update: function (dt) {
        rings.children.forEach(function (ring, i) { ring.rotation.z += dt * (0.3 + i * 0.03); });
        targets.forEach(function (g, i) {
          g.rotation.y += dt * 0.28; g.rotation.x += dt * 0.13;
          g.userData.pulse = Math.max(0, g.userData.pulse - dt * 1.9);
          var s = 1 + g.userData.pulse * 0.16;
          g.scale.setScalar(s);
          g.userData.body.material.opacity = 0.42 + g.userData.pulse * 0.3;
        });
        mols.forEach(function (m) {
          var u = m.userData;
          m.rotation.x += dt * 1.5; m.rotation.y += dt * 1.1;
          if (u.mode === 'flow') {
            u.p += u.v * dt;
            var tx = u.target >= 0 ? targets[u.target].position.x + LEN / 2 : Infinity;
            if (u.target >= 0 && u.p >= tx - 1.2) {
              place(m); u.from.copy(m.position); u.mode = 'commit'; u.k = 0;
            } else if (u.p > LEN) {
              u.p -= LEN;
              u.target = Math.random() < 0.42 ? (Math.random() * 3) | 0 : -1;
              place(m);
            } else place(m);
          } else {
            u.k += dt * 1.5;
            var tg = targets[u.target];
            if (u.k >= 1) {
              bursts.fire(tg.position);
              tg.userData.pulse = 1;
              state.events++;
              u.mode = 'flow'; u.p = 0;
              u.target = Math.random() < 0.42 ? (Math.random() * 3) | 0 : -1;
              place(m);
            } else {
              var e = u.k * u.k * (3 - 2 * u.k);
              m.position.lerpVectors(u.from, tg.position, e);
              var sc = 1 - e * 0.5;
              m.scale.setScalar(sc);
              m.userData.halo.material.opacity = 0.13 + e * 0.35;
            }
          }
          if (u.mode === 'flow' && m.scale.x !== 1) {
            m.scale.setScalar(1); m.userData.halo.material.opacity = 0.13;
          }
        });
        bursts.update(dt);
      }
    };
  }

  /* ---------------- view 02 · cellular ---------------- */
  function buildCellular() {
    var scene = new THREE.Scene();
    lights(scene);
    var hover = [];
    var CR = 6.2, RECEPTORS = 14;

    var membrane = new THREE.Mesh(
      new THREE.IcosahedronGeometry(CR, 3),
      new THREE.MeshStandardMaterial({
        color: C.cell, transparent: true, opacity: 0.17, roughness: 0.35,
        metalness: 0.05, side: THREE.DoubleSide, depthWrite: false
      })
    );
    membrane.userData.label = 'Cell membrane';
    membrane.userData.sub = 'lipid bilayer · ~5 nm thick';
    membrane.userData.lowPriority = true;
    scene.add(membrane); hover.push(membrane);
    var mwire = outline(new THREE.IcosahedronGeometry(CR * 1.002, 2), C.cell, 0.3);
    scene.add(mwire);

    var nucleus = new THREE.Mesh(
      new THREE.IcosahedronGeometry(2.0, 2),
      new THREE.MeshStandardMaterial({
        color: C.nucleus, roughness: 0.55, metalness: 0.08,
        emissive: C.cellDeep, emissiveIntensity: 0.22
      })
    );
    nucleus.userData.label = 'Nucleus';
    nucleus.userData.sub = 'genomic DNA · transcription';
    scene.add(nucleus); hover.push(nucleus);
    scene.add(outline(new THREE.IcosahedronGeometry(2.06, 1), C.cell, 0.4));

    var recs = [];
    var golden = Math.PI * (3 - Math.sqrt(5));
    for (var i = 0; i < RECEPTORS; i++) {
      var y = 1 - (i / (RECEPTORS - 1)) * 2;
      var rad = Math.sqrt(Math.max(0, 1 - y * y));
      var th = golden * i;
      var dir = new THREE.Vector3(Math.cos(th) * rad, y, Math.sin(th) * rad).normalize();
      var box = new THREE.Mesh(
        new THREE.BoxGeometry(0.5, 0.5, 0.78),
        new THREE.MeshStandardMaterial({
          color: C.receptor, emissive: C.receptor, emissiveIntensity: 0.12,
          roughness: 0.4, metalness: 0.15
        })
      );
      box.position.copy(dir).multiplyScalar(CR);
      box.lookAt(0, 0, 0);
      box.userData.label = 'Receptor protein';
      box.userData.sub = 'site ' + String(i + 1).padStart(2, '0') + ' · awaiting ligand';
      box.userData.dir = dir;
      box.userData.glow = 0;
      box.userData.taken = false;
      scene.add(box); hover.push(box); recs.push(box);
    }

    var bursts = Bursts(scene, C.receptor, 5, 26);
    var mols = [];
    for (var m0 = 0; m0 < 5; m0++) {
      var m = drugMesh(0.38);
      var a = Math.random() * TAU, b = Math.acos(2 * Math.random() - 1);
      m.userData.dir = new THREE.Vector3(
        Math.sin(b) * Math.cos(a), Math.cos(b), Math.sin(b) * Math.sin(a)
      ).normalize();
      m.userData.r = 11 + Math.random() * 2.5;
      m.userData.axis = new THREE.Vector3(
        Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5
      ).normalize();
      m.userData.rec = -1;
      m.userData.hold = 0;
      scene.add(m); mols.push(m); hover.push(m);
    }

    function assign(m) {
      var free = recs.filter(function (r) { return !r.userData.taken; });
      if (!free.length) return;
      var r = free[(Math.random() * free.length) | 0];
      r.userData.taken = true;
      m.userData.rec = recs.indexOf(r);
    }
    mols.forEach(assign);

    var tmp = new THREE.Vector3();

    return {
      scene: scene, hover: hover,
      update: function (dt) {
        membrane.rotation.y += dt * 0.09;
        mwire.rotation.y += dt * 0.09;
        nucleus.rotation.y -= dt * 0.22;
        nucleus.rotation.x += dt * 0.1;

        mols.forEach(function (m) {
          var u = m.userData;
          m.rotation.x += dt * 1.7; m.rotation.y += dt * 1.2;

          if (u.hold > 0) {
            u.hold -= dt;
            if (u.hold <= 0) {
              if (u.rec >= 0) recs[u.rec].userData.taken = false;
              u.rec = -1; u.r = 11 + Math.random() * 2.5;
              u.dir.set(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize();
              assign(m);
              m.scale.setScalar(1);
              u.halo.material.opacity = 0.13;
            }
            return;
          }
          if (u.rec < 0) { assign(m); if (u.rec < 0) return; }

          var rec = recs[u.rec];
          u.dir.applyAxisAngle(u.axis, dt * 0.85);
          u.dir.lerp(rec.userData.dir, Math.min(1, dt * 0.75)).normalize();
          var goalR = CR + 0.82;
          u.r += (goalR - u.r) * Math.min(1, dt * 0.85);
          m.position.copy(u.dir).multiplyScalar(u.r);

          var d = m.position.distanceTo(rec.position);
          if (d < 0.55) {
            bursts.fire(rec.position);
            rec.userData.glow = 1;
            rec.userData.sub = 'bound · complex formed';
            state.events++;
            u.hold = 1.1;
            m.position.copy(rec.position);
            m.scale.setScalar(0.72);
            u.halo.material.opacity = 0.42;
          }
        });

        recs.forEach(function (r) {
          var best = 99;
          for (var i = 0; i < mols.length; i++) {
            tmp.copy(mols[i].position);
            var d = tmp.distanceTo(r.position);
            if (d < best) best = d;
          }
          var prox = Math.max(0, 1 - best / 4.2);
          r.userData.glow = Math.max(r.userData.glow - dt * 1.4, prox);
          r.material.emissiveIntensity = 0.12 + r.userData.glow * 1.5;
          r.scale.setScalar(1 + r.userData.glow * 0.42);
        });

        bursts.update(dt);
      }
    };
  }

  /* ---------------- view 03 · molecular ---------------- */
  function buildMolecular() {
    var scene = new THREE.Scene();
    lights(scene);
    var hover = [];

    var core = new THREE.Mesh(
      new THREE.IcosahedronGeometry(1.55, 1),
      new THREE.MeshStandardMaterial({
        color: C.drug, emissive: C.drug, emissiveIntensity: 0.42,
        roughness: 0.32, metalness: 0.12
      })
    );
    core.userData.label = 'Drug molecule';
    core.userData.sub = 'core scaffold · ~1 nm';
    scene.add(core); hover.push(core);
    var coreWire = outline(new THREE.IcosahedronGeometry(1.62, 1), C.drug, 0.35);
    scene.add(coreWire);
    var halo = new THREE.Mesh(
      new THREE.SphereGeometry(2.35, 20, 16),
      new THREE.MeshBasicMaterial({
        color: C.drug, transparent: true, opacity: 0.1,
        blending: THREE.AdditiveBlending, depthWrite: false
      })
    );
    scene.add(halo);

    var atomDefs = [
      { n: 'Hydrogen', s: 'H · 1.008 u', c: C.H, r: 0.5, p: new THREE.Vector3(1, 1, 1) },
      { n: 'Carbon', s: 'C · 12.011 u', c: C.Cc, r: 0.82, p: new THREE.Vector3(1, -1, -1) },
      { n: 'Oxygen', s: 'O · 15.999 u', c: C.O, r: 0.74, p: new THREE.Vector3(-1, 1, -1) },
      { n: 'Nitrogen', s: 'N · 14.007 u', c: C.N, r: 0.72, p: new THREE.Vector3(-1, -1, 1) }
    ];

    var shell = new THREE.Group();
    scene.add(shell);
    var atoms = [];

    atomDefs.forEach(function (d) {
      var at = d.p.clone().normalize().multiplyScalar(3.5);
      var mesh = new THREE.Mesh(
        new THREE.SphereGeometry(d.r, 26, 20),
        new THREE.MeshStandardMaterial({
          color: d.c, roughness: 0.34, metalness: 0.18,
          emissive: d.c, emissiveIntensity: 0.1
        })
      );
      mesh.position.copy(at);
      mesh.userData.label = d.n; mesh.userData.sub = d.s;
      mesh.userData.home = at.clone();
      mesh.userData.ph = Math.random() * TAU;
      shell.add(mesh); atoms.push(mesh); hover.push(mesh);

      // bond line from atom to the central molecule
      var len = at.length() - d.r - 1.4;
      var bond = new THREE.Mesh(
        new THREE.CylinderGeometry(0.035, 0.035, Math.max(0.2, len), 6),
        new THREE.MeshBasicMaterial({ color: 0xC7D3DE, transparent: true, opacity: 0.5 })
      );
      bond.position.copy(at.clone().normalize().multiplyScalar(1.4 + len / 2));
      bond.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), at.clone().normalize());
      shell.add(bond);
      mesh.userData.bond = bond;
    });

    var orbits = new THREE.Group();
    [[0, 0, 0], [Math.PI / 2.2, 0.5, 0]].forEach(function (rot, i) {
      var ring = new THREE.Mesh(
        new THREE.TorusGeometry(4.5 + i * 0.55, 0.014, 5, 96),
        new THREE.MeshBasicMaterial({ color: C.drug, transparent: true, opacity: 0.22 })
      );
      ring.rotation.set(rot[0], rot[1], rot[2]);
      orbits.add(ring);
    });
    scene.add(orbits);

    return {
      scene: scene, hover: hover,
      update: function (dt) {
        core.rotation.y += dt * 0.42; core.rotation.x += dt * 0.19;
        coreWire.rotation.copy(core.rotation);
        var pulse = 0.42 + Math.sin(state.t * 1.7) * 0.12;
        core.material.emissiveIntensity = pulse;
        halo.material.opacity = 0.09 + Math.sin(state.t * 1.7) * 0.03;

        shell.rotation.y += dt * 0.5;
        shell.rotation.x += dt * 0.17;
        orbits.rotation.y -= dt * 0.22;
        orbits.rotation.z += dt * 0.1;

        atoms.forEach(function (a, i) {
          a.rotation.y += dt * 0.9;
          var bob = 1 + Math.sin(state.t * 1.6 + a.userData.ph) * 0.045;
          a.position.copy(a.userData.home).multiplyScalar(bob);
          a.userData.bond.material.opacity = 0.42 + Math.sin(state.t * 1.6 + a.userData.ph) * 0.1;
        });
      }
    };
  }

  function buildRoute() {
    var scene = new THREE.Scene();
    lights(scene);
    var hover = [];
    var site = SITES[state.site];
    var dark = isDark();
    var BODY = dark ? 0x7FA8C9 : 0x51789C;

    /* ---- schematic body ---- */
    var bodyMat = new THREE.MeshStandardMaterial({
      color: BODY, transparent: true, opacity: dark ? 0.06 : 0.09,
      roughness: 0.85, depthWrite: false, side: THREE.DoubleSide
    });
    var edgeMat = new THREE.LineBasicMaterial({
      color: BODY, transparent: true, opacity: dark ? 0.26 : 0.34
    });

    function piece(geo, x, y, z, sz) {
      var m = new THREE.Mesh(geo, bodyMat);
      m.position.set(x, y, z);
      if (sz) m.scale.set(sz[0], sz[1], sz[2]);
      scene.add(m);
      var e = new THREE.LineSegments(new THREE.EdgesGeometry(geo, 24), edgeMat);
      e.position.copy(m.position); e.scale.copy(m.scale);
      scene.add(e);
      return m;
    }
    function limb(a, b, r) {
      var A = V(a[0], a[1], a[2]), B = V(b[0], b[1], b[2]);
      var len = A.distanceTo(B);
      var g = new THREE.CylinderGeometry(r, r * 0.86, len, 8, 1, true);
      var m = new THREE.Mesh(g, bodyMat);
      m.position.copy(A).add(B).multiplyScalar(0.5);
      m.quaternion.setFromUnitVectors(V(0, 1, 0), B.clone().sub(A).normalize());
      scene.add(m);
      var e = new THREE.LineSegments(new THREE.EdgesGeometry(g, 24), edgeMat);
      e.position.copy(m.position); e.quaternion.copy(m.quaternion);
      scene.add(e);
    }

    piece(new THREE.SphereGeometry(1.45, 18, 14), 0, 8.7, 0, [0.86, 1, 0.9]);
    piece(new THREE.CylinderGeometry(0.5, 0.62, 1.1, 10, 1, true), 0, 7.35, 0);
    piece(new THREE.CylinderGeometry(1.95, 1.5, 6.6, 14, 1, true), 0, 3.5, 0, [1, 1, 0.62]);
    piece(new THREE.CylinderGeometry(1.5, 1.35, 1.8, 12, 1, true), 0, -0.7, 0, [1, 1, 0.62]);
    [-1, 1].forEach(function (s) {
      limb([s * 2.0, 6.15, 0], [s * 3.3, 2.6, 0.2], 0.42);
      limb([s * 3.3, 2.6, 0.2], [s * 3.95, -0.7, 0.25], 0.34);
      limb([s * 3.95, -0.7, 0.25], [s * 4.05, -1.85, 0.25], 0.26);
      limb([s * 0.95, -1.5, 0], [s * 1.25, -7.2, 0.1], 0.58);
      limb([s * 1.25, -7.2, 0.1], [s * 1.4, -12.2, 0.1], 0.42);
    });

    /* ---- organs ---- */
    var organs = [];
    ORGANS.forEach(function (o) {
      var geo = o.tall
        ? new THREE.CylinderGeometry(o.r, o.r * 0.75, o.tall, 10)
        : new THREE.IcosahedronGeometry(o.r, 1);
      var mat = new THREE.MeshStandardMaterial({
        color: C.cell, emissive: C.contrast, emissiveIntensity: 0,
        roughness: 0.5, metalness: 0.08, transparent: true, opacity: 0.34
      });
      var m = new THREE.Mesh(geo, mat);
      m.position.set(o.p[0], o.p[1], o.p[2]);
      m.userData.label = o.label; m.userData.sub = o.sub;
      m.userData.key = o.key; m.userData.base = 0.34;
      scene.add(m); hover.push(m); organs.push(m);
      var w = outline(geo.clone(), C.cell, 0.22);
      w.position.copy(m.position); scene.add(w);
      m.userData.wire = w;
    });

    /* ---- the route itself ---- */
    var pts = site.path.map(function (w) { return V(w[0], w[1], w[2]); });
    var curve = new THREE.CatmullRomCurve3(pts, false, 'catmullrom', 0.4);
    var vessel = new THREE.Mesh(
      new THREE.TubeGeometry(curve, 140, 0.085, 7, false),
      new THREE.MeshStandardMaterial({
        color: site.route === 'Intra-art.' ? C.blood : (site.id === 'oral' || site.id === 'intrathecal' ? C.receptor : C.vein),
        transparent: true, opacity: 0.45, roughness: 0.5, emissive: 0x000000
      })
    );
    vessel.userData.label = site.name;
    vessel.userData.sub = site.route + ' · ' + site.spec;
    scene.add(vessel); hover.push(vessel);

    // waypoint pips, each labelled with the anatomy it marks
    site.path.forEach(function (w, i) {
      if (i === 0) return;
      var pip = new THREE.Mesh(
        new THREE.SphereGeometry(0.11, 10, 8),
        new THREE.MeshStandardMaterial({
          color: C.ink, roughness: 0.4, transparent: true, opacity: 0.65
        })
      );
      pip.position.set(w[0], w[1], w[2]);
      pip.userData.label = w[4];
      pip.userData.sub = 'T+' + w[3] + ' s';
      scene.add(pip); hover.push(pip);
    });

    // every administration site is marked on the body and can be clicked
    SITES.forEach(function (st, i) {
      var on = i === state.site;
      var mk = new THREE.Mesh(
        new THREE.SphereGeometry(on ? 0.21 : 0.15, 14, 12),
        new THREE.MeshStandardMaterial({
          color: on ? C.contrast : C.ink,
          emissive: on ? C.contrast : 0x000000, emissiveIntensity: on ? 0.75 : 0,
          roughness: 0.4, transparent: true, opacity: on ? 1 : 0.5
        })
      );
      mk.position.set(st.path[0][0], st.path[0][1], st.path[0][2]);
      mk.userData.label = st.name;
      mk.userData.sub = on ? 'selected · ' + st.spec : 'click to inject here';
      mk.userData.siteIndex = i;
      scene.add(mk); hover.push(mk);
      if (on) {
        var ring = new THREE.Mesh(
          new THREE.TorusGeometry(0.42, 0.022, 6, 30),
          new THREE.MeshBasicMaterial({ color: C.contrast, transparent: true, opacity: 0.7 })
        );
        ring.position.copy(mk.position);
        scene.add(ring);
        mk.userData.ring = ring;
      }
    });

    /* ---- excretory trickle (kidneys → ureters → bladder) ---- */
    var excretion = null;
    if (site.excretion) {
      excretion = new THREE.Group();
      [-1, 1].forEach(function (s) {
        var uc = new THREE.CatmullRomCurve3([
          V(s * 0.95, 0.4, -0.6), V(s * 0.7, -0.4, -0.45), V(s * 0.3, -1.1, -0.1), V(0, -1.45, 0.32)
        ]);
        excretion.add(new THREE.Mesh(
          new THREE.TubeGeometry(uc, 40, 0.05, 6, false),
          new THREE.MeshStandardMaterial({
            color: C.contrast, emissive: C.contrast, emissiveIntensity: 0.5,
            transparent: true, opacity: 0, roughness: 0.4
          })
        ));
      });
      scene.add(excretion);
    }

    /* ---- the bolus ---- */
    var N = 150;
    var bpos = new Float32Array(N * 3);
    var bgeo = new THREE.BufferGeometry();
    bgeo.setAttribute('position', new THREE.BufferAttribute(bpos, 3));
    var bolus = new THREE.Points(bgeo, new THREE.PointsMaterial({
      color: C.contrast, size: 0.3, transparent: true, opacity: 0.95,
      depthWrite: false, blending: THREE.AdditiveBlending
    }));
    bolus.frustumCulled = false;
    scene.add(bolus);

    var jitter = [];
    for (var j = 0; j < N; j++) {
      jitter.push([(Math.random() - 0.5) * 0.13, (Math.random() - 0.5) * 0.13, (Math.random() - 0.5) * 0.13]);
    }

    var last = site.path[site.path.length - 1][3];
    var seg = site.path.length - 1;
    var tmp = new THREE.Vector3();

    // clinical time -> curve parameter, using the waypoints' own arrival times
    function uAt(T) {
      if (T <= site.path[0][3]) return 0;
      if (T >= last) return 1;
      for (var i = 0; i < seg; i++) {
        var a = site.path[i][3], b = site.path[i + 1][3];
        if (T <= b) return (i + (T - a) / (b - a)) / seg;
      }
      return 1;
    }

    function gauss(T, peak, width) {
      var z = (T - peak) / width;
      return Math.exp(-z * z);
    }

    return {
      scene: scene, hover: hover, isRoute: true, site: site,
      update: function (dt) {
        state.clinT += dt * site.timeScale;
        if (state.clinT > site.tmax) { state.clinT = 0; state.events = 0; }
        var T = state.clinT;

        // bolus: each particle trails the head by a slice of the injection duration
        for (var i = 0; i < N; i++) {
          var Ti = T - (i / N) * site.spread;
          var u = uAt(Ti < 0 ? 0 : Ti);
          curve.getPoint(u, tmp);
          bpos[i * 3] = tmp.x + jitter[i][0];
          bpos[i * 3 + 1] = tmp.y + jitter[i][1];
          bpos[i * 3 + 2] = tmp.z + jitter[i][2];
        }
        bgeo.attributes.position.needsUpdate = true;
        // first pass disperses into the capillary beds once it runs out of path
        var fade = T <= last ? 1 : Math.max(0, 1 - (T - last) / (site.tmax * 0.12));
        bolus.material.opacity = 0.95 * fade;

        // organ time-attenuation curves carry the story after that
        organs.forEach(function (m) {
          var e = site.enhance[m.userData.key];
          var v = e ? gauss(T, e[0], e[1]) * e[2] : 0;
          m.material.emissiveIntensity = v * 1.7;
          m.material.opacity = m.userData.base + v * 0.5;
          m.userData.wire.material.opacity = 0.22 + v * 0.35;
          var s = 1 + v * 0.07;
          m.scale.setScalar(s); m.userData.wire.scale.setScalar(s);
        });

        if (excretion) {
          var ev = gauss(T, site.enhance.bladder[0] - 30, 70);
          excretion.children.forEach(function (c) { c.material.opacity = ev * 0.8; });
        }

        vessel.material.opacity = 0.45 + (T < last ? 0.2 : 0) * fade;
      }
    };
  }

  var BUILDERS = [buildRoute, buildSystemic, buildCellular, buildMolecular];

  /* ---------------- lifecycle ---------------- */
  function disposeWorld(w) {
    if (!w) return;
    w.scene.traverse(function (o) {
      if (o.geometry) o.geometry.dispose();
      if (o.material) {
        if (Array.isArray(o.material)) o.material.forEach(function (m) { m.dispose(); });
        else o.material.dispose();
      }
    });
  }

  function loadView(i, keepCamera) {
    disposeWorld(world);
    state.view = i;
    state.t = 0;
    state.events = 0;
    world = BUILDERS[i]();
    var v = VIEWS[i];
    state.goal.radius = v.dist;
    if (!keepCamera) {
      state.goal.theta = v.theta;
      state.goal.phi = v.phi;
    }
    paintPanel(v);
    for (var b = 0; b < BUILDERS.length; b++) {
      document.getElementById('v' + b).setAttribute('aria-pressed', String(b === i));
    }
    var route = !!world.isRoute;
    document.getElementById('sites').hidden = !route;
    document.getElementById('timeline').hidden = !route;
    document.body.setAttribute('data-view', String(i));
    if (route) applyRoutePanel();
    hideTip();
  }

  /* ---------------- contrast route panel ---------------- */
  function applyRoutePanel() {
    var site = SITES[state.site];
    document.getElementById('peyebrow').textContent = 'Scale 01 — ' + site.route;
    document.getElementById('ptitle').textContent = site.name;
    document.getElementById('pbody').textContent = site.blurb;
    document.getElementById('rFieldLabel').textContent = 'Access';
    document.getElementById('rField').textContent = site.access;
    renderTimeline(site);
    lastPhase = -1;
    for (var i = 0; i < SITES.length; i++) {
      var el = document.getElementById('chip' + i);
      if (el) el.setAttribute('aria-pressed', String(i === state.site));
    }
  }

  function renderSites() {
    var wrap = document.getElementById('chips');
    wrap.innerHTML = '';
    SITES.forEach(function (st, i) {
      var b = document.createElement('button');
      b.className = 'chip'; b.id = 'chip' + i;
      b.setAttribute('aria-pressed', String(i === state.site));
      var tag = document.createElement('i'); tag.textContent = st.route;
      var nm = document.createElement('b'); nm.textContent = st.chip;
      b.appendChild(tag); b.appendChild(nm);
      b.addEventListener('click', function () { selectSite(i); });
      wrap.appendChild(b);
    });
  }

  function selectSite(i) {
    if (i === state.site) return;
    state.site = i;
    state.clinT = 0;
    loadView(0, true);
  }

  function renderTimeline(site) {
    var track = document.getElementById('tlTrack');
    // keep the playhead, replace the segments
    Array.prototype.slice.call(track.querySelectorAll('.tl-seg')).forEach(function (n) { n.remove(); });
    site.phases.forEach(function (ph, i) {
      var seg = document.createElement('div');
      seg.className = 'tl-seg'; seg.id = 'seg' + i;
      seg.style.left = (ph[0] / site.tmax * 100) + '%';
      seg.style.width = ((ph[1] - ph[0]) / site.tmax * 100) + '%';
      seg.title = ph[2] + '  ·  T+' + ph[0] + '–' + ph[1] + (site.tmax > 300 ? ' s' : ' s');
      track.insertBefore(seg, document.getElementById('tlHead'));
    });
    document.getElementById('tlEnd').textContent =
      'T+' + (site.tmax > 300 ? clinClock(site.tmax, site.tmax) : Math.round(site.tmax) + ' s');
  }

  function clinClock(sec, tmax) {
    if (tmax > 300) {
      var m = Math.floor(sec / 60), r = Math.floor(sec % 60);
      return m + ':' + String(r).padStart(2, '0');
    }
    return sec.toFixed(1) + ' s';
  }

  function phaseAt(site, T) {
    var found = null;
    for (var i = 0; i < site.phases.length; i++) {
      if (T >= site.phases[i][0]) found = i;
      if (T >= site.phases[i][0] && T <= site.phases[i][1]) return i;
    }
    return found === null ? 0 : found;
  }

  function paintPanel(v) {
    document.getElementById('peyebrow').textContent = v.eyebrow;
    document.getElementById('ptitle').textContent = v.title;
    document.getElementById('pbody').textContent = v.body;
    document.getElementById('rField').textContent = v.field;
    document.getElementById('rFieldLabel').textContent = 'Field';
    document.getElementById('rEventLabel').textContent = v.eventLabel;
    document.getElementById('pdot').style.background = '#' + v.accent.toString(16).padStart(6, '0');
    var keys = document.getElementById('keys');
    keys.innerHTML = '';
    v.keys.forEach(function (k) {
      var row = document.createElement('div');
      row.className = 'key';
      var sw = document.createElement('i');
      sw.style.background = 'var(' + k[0] + ')';
      var txt = document.createElement('span');
      txt.innerHTML = '<b></b> ';
      txt.querySelector('b').textContent = k[1];
      txt.appendChild(document.createTextNode(k[2]));
      row.appendChild(sw); row.appendChild(txt);
      keys.appendChild(row);
    });
  }

  /* ---------------- interaction ---------------- */
  var dragging = false, lastX = 0, lastY = 0, moved = false;
  // Touch has no hover, so a tap stands in for it: a tap that didn't drag holds
  // the label open for a moment instead of vanishing with the finger.
  var lastType = 'mouse', touchTipUntil = 0, TAP_TIP_MS = 2600;

  canvas.addEventListener('pointerdown', function (e) {
    dragging = true; moved = false; lastX = e.clientX; lastY = e.clientY;
    lastType = e.pointerType || 'mouse';
    canvas.classList.add('dragging');
    canvas.setPointerCapture(e.pointerId);
    hideTip();
  });
  canvas.addEventListener('pointermove', function (e) {
    lastType = e.pointerType || 'mouse';
    var rect = canvas.getBoundingClientRect();
    pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    state.parallaxGoal.set(pointer.x * 1.1, pointer.y * 0.75);
    if (!dragging) return;
    var dx = e.clientX - lastX, dy = e.clientY - lastY;
    if (Math.abs(dx) + Math.abs(dy) > 2) moved = true;
    lastX = e.clientX; lastY = e.clientY;
    state.goal.theta -= dx * 0.006;
    state.goal.phi = Math.max(0.16, Math.min(Math.PI - 0.16, state.goal.phi - dy * 0.006));
  });
  function endDrag(e) {
    dragging = false; canvas.classList.remove('dragging');
    if (e && e.pointerId != null && canvas.hasPointerCapture && canvas.hasPointerCapture(e.pointerId)) {
      canvas.releasePointerCapture(e.pointerId);
    }
    if (e && e.pointerType === 'touch') {
      state.parallaxGoal.set(0, 0);
      if (moved) { touchTipUntil = 0; pointer.set(-2, -2); }
      else { touchTipUntil = (window.performance ? performance.now() : Date.now()) + TAP_TIP_MS; }
    }
  }
  canvas.addEventListener('pointerup', function (e) {
    if (!moved && world) {
      raycaster.setFromCamera(pointer, camera);
      var hits = raycaster.intersectObjects(world.hover, true);
      for (var i = 0; i < hits.length; i++) {
        var o = hits[i].object;
        while (o && o.userData.siteIndex === undefined) o = o.parent;
        if (o) { endDrag(e); selectSite(o.userData.siteIndex); return; }
      }
    }
    endDrag(e);
  });
  canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('pointerleave', function (e) {
    // A touch pointer "leaves" the moment the finger lifts; don't let that
    // cancel the tap label.
    if (e && e.pointerType === 'touch') return;
    pointer.set(-2, -2); state.parallaxGoal.set(0, 0); hideTip();
  });

  canvas.addEventListener('wheel', function (e) {
    e.preventDefault();
    var f = Math.exp(e.deltaY * 0.0012);
    state.goal.radius = Math.max(6, Math.min(70, state.goal.radius * f));
  }, { passive: false });

  var pinch = 0;
  canvas.addEventListener('touchmove', function (e) {
    if (e.touches.length !== 2) return;
    e.preventDefault();
    var dx = e.touches[0].clientX - e.touches[1].clientX;
    var dy = e.touches[0].clientY - e.touches[1].clientY;
    var d = Math.hypot(dx, dy);
    if (pinch) state.goal.radius = Math.max(6, Math.min(70, state.goal.radius * (pinch / d)));
    pinch = d;
  }, { passive: false });
  canvas.addEventListener('touchend', function () { pinch = 0; });

  /* controls */
  function setPlaying(on) {
    state.playing = on;
    var btn = document.getElementById('play');
    btn.dataset.on = String(on);
    btn.setAttribute('aria-label', on ? 'Pause animation' : 'Play animation');
    document.getElementById('playLabel').textContent = on ? 'Pause' : 'Play';
    document.getElementById('playIcon').innerHTML = on
      ? '<rect x="0" y="0" width="3" height="11" fill="currentColor"/><rect x="6" y="0" width="3" height="11" fill="currentColor"/>'
      : '<path d="M0 0 L9 5.5 L0 11 Z" fill="currentColor"/>';
  }
  document.getElementById('play').addEventListener('click', function () { setPlaying(!state.playing); });
  document.getElementById('reset').addEventListener('click', function () {
    state.clinT = 0; loadView(state.view, false);
  });
  for (var vb = 0; vb < BUILDERS.length; vb++) {
    (function (idx) {
      document.getElementById('v' + idx).addEventListener('click', function () {
        if (state.view !== idx) loadView(idx, false);
      });
    })(vb);
  }
  var speedEl = document.getElementById('speed');
  speedEl.addEventListener('input', function () {
    state.speed = parseFloat(speedEl.value);
    document.getElementById('speedVal').textContent = state.speed.toFixed(2) + '×';
    document.getElementById('rRate').textContent = state.speed.toFixed(2) + '×';
  });

  document.addEventListener('keydown', function (e) {
    if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    if (e.key >= '1' && e.key <= String(BUILDERS.length)) {
      loadView(parseInt(e.key, 10) - 1, false);
    } else if (e.code === 'Space') {
      e.preventDefault(); setPlaying(!state.playing);
    } else if (e.key === 'r' || e.key === 'R') {
      loadView(state.view, false);
    }
  });

  /* tooltip */
  var tip = document.getElementById('tip');
  var tipName = document.getElementById('tipName');
  var tipSub = document.getElementById('tipSub');
  var tipOn = false;
  function hideTip() { if (tipOn) { tip.style.opacity = '0'; tipOn = false; } }

  function labelled(o) {
    while (o) { if (o.userData && o.userData.label) return o; o = o.parent; }
    return null;
  }

  function probe() {
    if (dragging || pointer.x < -1.5 || !world) { hideTip(); return; }
    if (lastType === 'touch') {
      var now = window.performance ? performance.now() : Date.now();
      if (now > touchTipUntil) { hideTip(); return; }
    }
    raycaster.setFromCamera(pointer, camera);
    var hits = raycaster.intersectObjects(world.hover, true);
    if (!hits.length) { hideTip(); return; }
    // Translucent shells (vessel wall, membrane) sit in front of everything they
    // contain, so they only win a hover when nothing else is under the cursor.
    var obj = null, fallback = null;
    for (var i = 0; i < hits.length; i++) {
      var cand = labelled(hits[i].object);
      if (!cand) continue;
      if (!cand.userData.lowPriority) { obj = cand; break; }
      if (!fallback) fallback = cand;
    }
    if (!obj) obj = fallback;
    if (!obj) { hideTip(); return; }
    tipName.textContent = obj.userData.label;
    tipSub.textContent = obj.userData.sub || '';
    var rect = canvas.getBoundingClientRect();
    tip.style.left = (rect.left + (pointer.x + 1) / 2 * rect.width) + 'px';
    tip.style.top = (rect.top + (1 - pointer.y) / 2 * rect.height) + 'px';
    if (!tipOn) { tip.style.opacity = '1'; tipOn = true; }
  }

  /* ---------------- resize ---------------- */
  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);

  /* ---------------- theme ---------------- */
  function relight() {
    var dark = isDark();
    if (!world) return;
    world.scene.traverse(function (o) {
      if (o.isHemisphereLight) { o.intensity = dark ? 0.72 : 1.05; o.groundColor.setHex(dark ? 0x0A1017 : 0x9BAAB8); }
      else if (o.isDirectionalLight) {
        o.intensity = o.position.x > 0 ? (dark ? 0.95 : 1.25) : (dark ? 0.42 : 0.34);
      }
    });
  }
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener
    ? window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', relight)
    : null;
  new MutationObserver(relight).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  /* ---------------- loop ---------------- */
  var timeEl = document.getElementById('rTime');
  var eventsEl = document.getElementById('rEvents');
  var tlHead = document.getElementById('tlHead');
  var tlPhase = document.getElementById('tlPhase');
  var lastShown = -1, lastPhase = -1;

  function fmt(s) {
    var m = Math.floor(s / 60);
    var r = s - m * 60;
    return String(m).padStart(2, '0') + ':' + (r < 10 ? '0' : '') + r.toFixed(1);
  }

  function frame() {
    requestAnimationFrame(frame);
    var raw = Math.min(clock.getDelta(), 0.05);
    var dt = raw * state.speed;

    if (state.playing) {
      state.t += dt;
      world.update(dt);
    }

    var o = state.orbit, g = state.goal, k = Math.min(1, raw * 6);
    o.theta += (g.theta - o.theta) * k;
    o.phi += (g.phi - o.phi) * k;
    o.radius += (g.radius - o.radius) * k;
    state.parallax.lerp(state.parallaxGoal, Math.min(1, raw * 2.4));

    camera.position.set(
      o.radius * Math.sin(o.phi) * Math.sin(o.theta) + state.parallax.x,
      o.radius * Math.cos(o.phi) + state.parallax.y,
      o.radius * Math.sin(o.phi) * Math.cos(o.theta)
    );
    camera.lookAt(0, 0, 0);

    probe();
    renderer.render(world.scene, camera);

    var shown = Math.floor(state.t * 10);
    if (shown !== lastShown) {
      lastShown = shown;
      if (world.isRoute) {
        var site = world.site, T = state.clinT;
        timeEl.textContent = 'T+' + clinClock(T, site.tmax);
        var pi = phaseAt(site, T);
        eventsEl.textContent = site.phases[pi][2];
        tlHead.style.left = Math.min(100, T / site.tmax * 100) + '%';
        if (pi !== lastPhase) {
          lastPhase = pi;
          tlPhase.textContent = site.phases[pi][3];
          for (var q = 0; q < site.phases.length; q++) {
            var sg = document.getElementById('seg' + q);
            if (sg) sg.className = 'tl-seg' + (q === pi ? ' on' : '');
          }
        }
      } else {
        timeEl.textContent = fmt(state.t);
        eventsEl.textContent = state.view === 3 ? '4' : String(state.events);
      }
    }
  }

  /* ---------------- boot ---------------- */
  resize();
  renderSites();
  loadView(0, false);
  state.orbit.theta = state.goal.theta;
  state.orbit.phi = state.goal.phi;
  state.orbit.radius = state.goal.radius;
  setPlaying(state.playing);
  document.getElementById('rRate').textContent = state.speed.toFixed(2) + '×';
  frame();
})();
</script>
